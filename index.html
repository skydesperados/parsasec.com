<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Security writeups by skydesperados.">
  <meta name="author" content="skydesperados">
  <link rel="canonical" href="https://parsasec.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ParsaSec">
  <meta property="og:title" content="Writeups | ParsaSec">
  <meta property="og:description" content="Security writeups by skydesperados.">
  <meta property="og:url" content="https://parsasec.com/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@skydesperados">
  <title>Writeups | ParsaSec</title>
  <script>
    (() => {
      const legacySections = [
        '#article', '#writeup-title', '#overview', '#overview-title',
        '#how-it-works', '#actions-title', '#finding-actions', '#finding-title',
        '#case-01', '#case-01-title', '#case-02', '#case-02-title',
        '#case-03', '#case-03-title', '#fixes', '#fixes-title',
        '#appendix', '#appendix-title', '#bug-one-flow', '#flow-title',
        '#bug-one-recording'
      ];
      function redirectLegacySection() {
        if (legacySections.includes(location.hash)) {
          location.replace('writeups/nextjs-server-actions/' + location.hash);
        }
      }
      window.addEventListener('hashchange', redirectLegacySection);
      redirectLegacySection();
      try {
        const saved = localStorage.getItem('sky-writeup-theme');
        if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
      } catch {}
    })();
  </script>
  <style>
    :root {
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --bg: #f7f8fc; --surface: #ffffff; --ink: #20283b; --muted: #56637b;
      --border: #dce1ed; --border-2: #c6cede; --accent: #3e50af; --selection: #dbe2ff;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #10131a; --surface: #181d27; --ink: #ecf0f8; --muted: #b0bbce;
        --border: #2e3749; --border-2: #46536d; --accent: #aabbff; --selection: #35416d;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #10131a; --surface: #181d27; --ink: #ecf0f8; --muted: #b0bbce;
      --border: #2e3749; --border-2: #46536d; --accent: #aabbff; --selection: #35416d;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 16px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--selection); color: var(--ink); }
    a { color: var(--accent); text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; border-radius: 3px; }
    .home { width: min(720px, calc(100% - 48px)); margin: 72px auto; }
    .page-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    h1 { margin: 0; font: 500 36px/1.2 var(--serif); letter-spacing: -.03em; }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 8px 12px; border: 1px solid var(--border-2); border-radius: 50px; background: transparent; color: var(--ink); font: 12px/1.5 var(--sans); cursor: pointer; }
    .theme-toggle:hover { background: var(--surface); }
    .theme-toggle svg { width: 15px; height: 15px; }
    .writeup-list { list-style: none; margin: 32px 0 0; padding: 0; border-top: 1px solid var(--border); }
    .writeup-list li { border-bottom: 1px solid var(--border); }
    .writeup-list a { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; color: var(--ink); text-decoration: none; font-size: 18px; line-height: 1.6; }
    .writeup-list a:hover { color: var(--accent); }
    .writeup-list svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--accent); }
    .profiles { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-top: 40px; }
    .profiles a { color: var(--muted); font-size: 12px; }
    .profiles a:hover { color: var(--accent); }
    @media (max-width: 480px) {
      .home { width: calc(100% - 40px); margin-top: 36px; }
      h1 { font-size: 32px; }
      .writeup-list a { font-size: 17px; gap: 16px; }
    }
    @media print {
      body { background: #fff; color: #111; }
      .home { width: 100%; margin: 0; }
      .theme-toggle { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="home">
    <header class="page-header">
      <h1>Writeups</h1>
      <button class="theme-toggle" id="theme-toggle" type="button" hidden aria-label="Switch color theme">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.8A9 9 0 0 1 11.2 3 9 9 0 1 0 21 12.8Z"/></svg>
        <span id="theme-label">Dark</span>
      </button>
    </header>
    <main>
      <ul class="writeup-list" aria-label="Published writeups">
        <li>
          <a href="writeups/nextjs-server-actions/">
            <span>Next.js Server Actions: Broken Access Control</span>
            <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h13m-5-5 5 5-5 5"/></svg>
          </a>
        </li>
      </ul>
    </main>
    <footer class="profiles" aria-label="Profile links">
      <a href="https://x.com/skydesperados" target="_blank" rel="noopener noreferrer me">X</a>
      <a href="https://github.com/skydesperados" target="_blank" rel="noopener noreferrer me">GitHub</a>
      <a href="https://hackerone.com/skydesperados" target="_blank" rel="noopener noreferrer me">HackerOne</a>
    </footer>
  </div>
  <script>
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('theme-toggle');
      const label = document.getElementById('theme-label');
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : systemTheme.matches;
      function updateButton() {
        const next = isDark() ? 'Light' : 'Dark';
        label.textContent = next;
        button.setAttribute('aria-label', 'Switch to ' + next.toLowerCase() + ' theme');
      }
      button.hidden = false;
      button.addEventListener('click', () => {
        root.dataset.theme = isDark() ? 'light' : 'dark';
        try { localStorage.setItem('sky-writeup-theme', root.dataset.theme); } catch {}
        updateButton();
      });
      systemTheme.addEventListener('change', updateButton);
      updateButton();
    })();
  </script>
</body>
</html>
